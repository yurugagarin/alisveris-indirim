name: probe
on:
  push:
    branches: ["claude/**"]
    paths: ["tools/probe.py", ".github/workflows/probe.yml", "tools/probe_urls.txt"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - run: python tools/probe.py $(grep -v '^#' tools/probe_urls.txt)
